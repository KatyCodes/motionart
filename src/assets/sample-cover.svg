<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <title>Abstract night drive sample album cover</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fcb5d9"/>
      <stop offset=".42" stop-color="#8761bc"/>
      <stop offset="1" stop-color="#151327"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe4ae"/>
      <stop offset=".45" stop-color="#ff769f"/>
      <stop offset="1" stop-color="#8d3ab6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#sky)"/>
  <circle cx="600" cy="505" r="290" fill="#ff91bd" opacity=".28" filter="url(#blur)"/>
  <circle cx="600" cy="505" r="230" fill="url(#orb)"/>
  <path d="M0 850 Q250 720 520 845 T1200 800 V1200 H0Z" fill="#24203e"/>
  <path d="M0 920 Q310 790 600 925 T1200 875 V1200 H0Z" fill="#121222" opacity=".82"/>
  <g fill="#fff5ec" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="600" y="155" font-size="40" letter-spacing="20">GENERA</text>
    <text x="600" y="1080" font-size="92" font-weight="700" letter-spacing="14">DAYDREAM</text>
    <text x="600" y="1135" font-size="24" letter-spacing="10" opacity=".72">ALBUM MOTION</text>
  </g>
</svg>
